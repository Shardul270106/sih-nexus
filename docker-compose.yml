services:
  mongo:
    image: mongo:7
    container_name: agni-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    container_name: agni-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/agni_drishti
      - JWT_SECRET=${JWT_SECRET:-dev-insecure-jwt-secret}
      - FIRMS_MAP_KEY=${FIRMS_MAP_KEY:-}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:5173}
    depends_on:
      - mongo

  frontend:
    build: ./frontend/AGNI-DRISHTI
    container_name: agni-frontend
    restart: unless-stopped
    ports:
      - "3000:80"

volumes:
  mongo_data:
